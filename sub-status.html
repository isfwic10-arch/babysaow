<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saow · Subscription</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@300;500;700&display=swap');

    :root {
      --bg: #05060f;
      --cyan: #22d3ee;
      --violet: #a78bfa;
      --pink: #f472b6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --card: rgba(15, 23, 42, 0.82);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 15% 15%, rgba(34,211,238,.13), transparent 50%),
        radial-gradient(ellipse 60% 40% at 85% 80%, rgba(167,139,250,.14), transparent 50%),
        radial-gradient(ellipse 50% 30% at 50% 50%, rgba(244,114,182,.07), transparent 60%);
      animation: drift 14s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: scale(1) translate(0,0); }
      to   { transform: scale(1.07) translate(-1.5%,1.5%); }
    }

    canvas#particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 2;
      max-width: 480px;
      margin: 0 auto;
      padding: 2.2rem 1.1rem 3rem;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(2.1rem, 7vw, 2.9rem);
      letter-spacing: .18em;
      text-align: center;
      background: linear-gradient(120deg, var(--cyan), var(--violet), var(--pink), var(--cyan));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientMove 6s linear infinite, glowPulse 2.8s ease-in-out infinite;
      margin-bottom: .25rem;
    }

    @keyframes gradientMove {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(34,211,238,.35)); }
      50%      { filter: drop-shadow(0 0 20px rgba(167,139,250,.55)); }
    }

    .tagline {
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 300;
      margin-bottom: 1.6rem;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(148,163,184,.14);
      border-radius: 20px;
      padding: 1.4rem 1.25rem;
      margin-bottom: 1.1rem;
      box-shadow: 0 20px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(34,211,238,.06);
      backdrop-filter: blur(16px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .4rem .9rem;
      border-radius: 999px;
      background: rgba(34,211,238,.08);
      border: 1px solid rgba(34,211,238,.28);
      margin-bottom: 1rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52,211,153,.55);
      animation: ping 1.6s ease-out infinite;
    }

    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(52,211,153,.55); }
      70%  { box-shadow: 0 0 0 9px rgba(52,211,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }

    .badge span {
      font-family: 'Orbitron', sans-serif;
      font-size: .72rem;
      letter-spacing: .12em;
      color: var(--cyan);
    }

    .status-title {
      font-family: 'Orbitron', sans-serif;
      font-size: .78rem;
      letter-spacing: .14em;
      color: var(--muted);
      margin-bottom: .6rem;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .45rem 0;
      border-bottom: 1px solid rgba(148,163,184,.08);
      font-size: .92rem;
    }

    .row:last-child { border-bottom: none; }
    .row .label { color: var(--muted); }
    .row .value { font-weight: 500; }
    .row .value.good { color: #34d399; }
    .row .value.warn { color: #fbbf24; }
    .row .value.bad  { color: #f87171; }

    .progress {
      height: 7px;
      border-radius: 99px;
      background: rgba(148,163,184,.12);
      margin-top: .7rem;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      transition: width .6s ease;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: .75rem;
      letter-spacing: .16em;
      color: var(--muted);
      margin: 1.6rem 0 .9rem;
      text-align: center;
    }

    /* QR زیبا و رنگی */
    .qr-single {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(145deg, rgba(15,23,42,0.9), rgba(2,6,23,0.7));
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 22px;
      padding: 1.6rem 1.3rem;
      position: relative;
      overflow: hidden;
    }

    .qr-single::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: conic-gradient(from 0deg, transparent, rgba(34,211,238,0.12), transparent 40%);
      animation: spin 10s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .qr-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-frame {
      padding: 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(34,211,238,0.15), rgba(167,139,250,0.15));
      box-shadow:
        0 0 0 1px rgba(34,211,238,0.3),
        0 10px 40px rgba(34,211,238,0.15);
    }

    .qr-frame img {
      width: 170px;
      height: 170px;
      border-radius: 10px;
      display: block;
    }

    .qr-single .label {
      margin-top: 1.1rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--cyan);
    }

    .qr-single .hint {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
    }

    .ip-box {
      display: flex;
      justify-content: space-between;
      gap: .8rem;
      flex-wrap: wrap;
    }

    .chip {
      font-family: 'Orbitron', sans-serif;
      font-size: .7rem;
      letter-spacing: .06em;
      padding: .35rem .7rem;
      border-radius: 8px;
      background: rgba(148,163,184,.08);
      border: 1px solid rgba(148,163,184,.15);
      color: var(--muted);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      margin-top: 1.15rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.8rem 0.6rem;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.22s ease;
      text-decoration: none;
      border: none;
    }

    .btn-copy {
      background: rgba(34,211,238,0.1);
      border: 1px solid rgba(34,211,238,0.32);
      color: var(--cyan);
    }

    .btn-copy:hover {
      background: rgba(34,211,238,0.2);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(34,211,238,0.15);
    }

    .btn-v2ray {
      background: linear-gradient(135deg, rgba(167,139,250,0.18), rgba(244,114,182,0.12));
      border: 1px solid rgba(167,139,250,0.4);
      color: #c4b5fd;
    }

    .btn-v2ray:hover {
      background: linear-gradient(135deg, rgba(167,139,250,0.28), rgba(244,114,182,0.2));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(167,139,250,0.2);
    }

    .footer {
      text-align: center;
      margin-top: 1.8rem;
      font-size: .72rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="particles"></canvas>

  <div class="wrap">
    <div class="logo">SAOW</div>
    <p class="tagline">Subscription · Status</p>

    <!-- اطلاعات اکانت -->
    <div class="card">
      <div class="badge">
        <div class="dot"></div>
        <span id="statusBadge">LOADING</span>
      </div>

      <div class="status-title">ACCOUNT INFO</div>
      <div class="row"><span class="label">نام</span><span class="value" id="name">—</span></div>
      <div class="row"><span class="label">وضعیت</span><span class="value" id="status">—</span></div>
      <div class="row"><span class="label">انقضا</span><span class="value" id="expiry">—</span></div>
      <div class="row"><span class="label">مصرف</span><span class="value" id="usage">—</span></div>
      <div class="row"><span class="label">حجم کل</span><span class="value" id="quota">—</span></div>
      <div class="row"><span class="label">IP همزمان</span><span class="value" id="ips">—</span></div>

      <div class="progress"><div id="bar" style="width:0%"></div></div>
    </div>

    <!-- اطلاعات اتصال -->
    <div class="card">
      <div class="status-title">YOUR CONNECTION</div>
      <div class="ip-box">
        <div class="chip" id="ip">IP: —</div>
        <div class="chip" id="country">Country: —</div>
      </div>
    </div>

    <!-- QR رنگی و زیبا -->
    <div class="section-title">QR CODE</div>
    <div class="qr-single">
      <div class="qr-inner">
        <div class="qr-frame">
          <img id="qrImg" src="" alt="Subscription QR" loading="lazy">
        </div>
        <div class="label">SUBSCRIPTION LINK</div>
        <div class="hint">با اسکن این QR، لینک سابسکریپشن<br>مستقیماً به اپلیکیشن اضافه می‌شود</div>
      </div>
    </div>

    <!-- دکمه‌ها -->
    <div class="actions">
      <button class="btn btn-copy" onclick="copySub()">کپی لینک ساب</button>
      <a class="btn btn-v2ray" id="v2rayBtn" href="#">باز کردن در v2rayNG</a>
    </div>

    <p class="footer">Powered by Saow Panel</p>
  </div>

  <script>
    const DATA = window.__SAOW_SUB__ || {};

    function set(id, val, cls) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = val;
      if (cls) el.className = 'value ' + cls;
    }

    function statusClass(s) {
      if (s === 'active') return 'good';
      if (s === 'expired' || s === 'disabled' || s === 'quota-exceeded') return 'bad';
      return 'warn';
    }

    // اطلاعات اکانت
    set('name', DATA.name || '—');
    set('status', DATA.status || '—', statusClass(DATA.status));
    set('expiry', DATA.expiryText || '∞');
    set('usage', DATA.usageText || '—');
    set('quota', DATA.quotaText || '∞');
    set('ips', (DATA.activeIPs ?? '—') + ' / ' + (DATA.ipLimit ?? '—'));
    set('ip', 'IP: ' + (DATA.clientIP || '—'));
    set('country', 'Country: ' + (DATA.country || '—'));

    document.getElementById('statusBadge').textContent =
      DATA.status === 'active' ? 'ACTIVE' : (DATA.status || 'UNKNOWN').toUpperCase();

    const pct = Math.min(100, DATA.usagePercent || 0);
    document.getElementById('bar').style.width = pct + '%';

    // QR رنگی (cyan روی پس‌زمینه تیره)
    const subUrl = DATA.subUrl || location.href;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=22d3ee&bgcolor=0a0e1a&margin=8&data=${encodeURIComponent(subUrl)}`;
    document.getElementById('qrImg').src = qrUrl;

    // دکمه v2rayNG
    const v2rayBtn = document.getElementById('v2rayBtn');
    v2rayBtn.href = `v2rayng://install-config?url=${encodeURIComponent(subUrl)}`;

    // پشتیبانی از چند کلاینت (اختیاری - روی موبایل کار می‌کند)
    v2rayBtn.addEventListener('click', (e) => {
      // اول v2rayNG را امتحان می‌کند
      // اگر نصب نبود، کاربر می‌تواند از دکمه کپی استفاده کند
    });

    function copySub() {
      navigator.clipboard.writeText(subUrl).then(() => {
        const btn = document.querySelector('.btn-copy');
        const original = btn.textContent;
        btn.textContent = 'کپی شد ✓';
        setTimeout(() => btn.textContent = original, 1800);
      });
    }

    // particles
    const c = document.getElementById('particles');
    const ctx = c.getContext('2d');
    let w, h, dots = [];

    function resize() {
      w = c.width = innerWidth;
      h = c.height = innerHeight;
      dots = Array.from({ length: Math.min(55, Math.floor(w * h / 20000)) }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.5 + 0.4,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        a: Math.random() * 0.45 + 0.15
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const d of dots) {
        d.x += d.vx; d.y += d.vy;
        if (d.x < 0 || d.x > w) d.vx *= -1;
        if (d.y < 0 || d.y > h) d.vy *= -1;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(34,211,238,${d.a})`;
        ctx.fill();
      }
      for (let i = 0; i < dots.length; i++) {
        for (let j = i + 1; j < dots.length; j++) {
          const a = dots[i], b = dots[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 100) {
            ctx.strokeStyle = `rgba(167,139,250,${0.1 * (1 - dist / 100)})`;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }

    addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
